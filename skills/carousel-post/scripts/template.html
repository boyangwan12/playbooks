<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:'DM Sans';src:url('__FONT__') format('woff2');font-weight:100 1000;font-style:normal}
:root{--bg:#f4f1e9;--ink:#1c1c1c;--soft:#2e2e2c;--w:1080px;--h:1350px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
@page{size:1080px 1350px;margin:0}
.slide{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--ink);page-break-after:always;break-after:page}
.slide:last-child{page-break-after:auto;break-after:auto}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%}
.content{position:absolute;left:88px;right:88px;top:96px}
h1{font-weight:300;font-size:72px;line-height:1.05;letter-spacing:-.015em;margin-bottom:54px}
p{font-weight:300;font-size:33px;line-height:1.46;color:var(--soft);margin-bottom:30px}
p.b{font-weight:600;color:var(--ink)}
p.item b{font-weight:600;color:var(--ink)}
p.note{font-size:27px;font-weight:400;margin-top:8px}
p.email{font-size:29px;font-weight:400;margin-top:-6px}
.foot{position:absolute;left:88px;right:88px;bottom:54px;display:flex;justify-content:space-between;align-items:center}
.foot img{height:50px;display:block}
.foot span{font-size:26px;font-weight:300;letter-spacing:.04em;color:var(--soft)}
</style></head><body>__SLIDES__</body></html>
